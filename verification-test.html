<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>본인인증 테스트</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Helvetica", "Arial", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        font-size: 28px;
        color: #333;
        margin-bottom: 8px;
        text-align: center;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 32px;
        font-size: 14px;
      }

      .section {
        margin-bottom: 32px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        color: #333;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
      }

      .section-title::before {
        content: "";
        display: inline-block;
        width: 4px;
        height: 20px;
        background: #667eea;
        margin-right: 8px;
        border-radius: 2px;
      }

      .input-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #555;
        margin-bottom: 8px;
      }

      input[type="text"],
      input[type="url"] {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      input[type="url"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 24px;
      }

      button {
        padding: 14px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-desktop {
        background: #667eea;
        color: white;
      }

      .btn-desktop:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-mobile {
        background: #764ba2;
        color: white;
      }

      .btn-mobile:hover {
        background: #63408a;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .icon {
        font-size: 20px;
      }

      .result {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 20px;
        margin-top: 24px;
        display: none;
      }

      .result.show {
        display: block;
      }

      .result-title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 12px;
      }

      .result-success {
        border-left: 4px solid #10b981;
      }

      .result-error {
        border-left: 4px solid #ef4444;
      }

      .result-item {
        display: flex;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .result-label {
        font-weight: 600;
        color: #555;
        min-width: 140px;
      }

      .result-value {
        color: #333;
        word-break: break-all;
      }

      .info-box {
        background: #e0e7ff;
        border-left: 4px solid #667eea;
        padding: 16px;
        border-radius: 8px;
        margin-top: 24px;
      }

      .info-box h3 {
        font-size: 14px;
        font-weight: 600;
        color: #667eea;
        margin-bottom: 8px;
      }

      .info-box ul {
        list-style: none;
        font-size: 13px;
        color: #555;
      }

      .info-box li {
        margin-bottom: 4px;
        padding-left: 16px;
        position: relative;
      }

      .info-box li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: #667eea;
      }

      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        .container {
          padding: 24px;
        }

        h1 {
          font-size: 24px;
        }

        .button-group {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>본인인증 테스트</h1>

      <div class="section">
        <div class="input-group">
          <label for="apiUrl">API URL</label>
          <input
            type="url"
            id="apiUrl"
            placeholder="http://localhost:8000"
            value="http://localhost:8000"
          />
          <label for="apiUrl">JWT Token</label>
          <input
            type="text"
            id="jwtToken"
            placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          />
        </div>
      </div>

      <div class="section">
        <div class="button-group">
          <button class="btn-desktop" onclick="startVerification()">
            <span>본인인증</span>
          </button>
        </div>
      </div>

      <div id="result" class="result">
        <div class="result-title" id="resultTitle"></div>
        <div id="resultContent"></div>
      </div>
    </div>

    <script>
      // Form HTML 생성 함수
      function createVerificationForm(certViewUrl, formData) {
        let formFields = "";
        for (const [key, value] of Object.entries(formData)) {
          formFields += `    <input type="hidden" name="${key}" value="${value}"/>\n`;
        }

        return `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>본인인증</title>
</head>
<body>
  <form id="cert_form" method="post" action="${certViewUrl}" target="_self">
${formFields}
  </form>
  <script type="text/javascript">
    document.getElementById('cert_form').submit();
  <\/script>
</body>
</html>
`;
      }

      // postMessage 리스너
      window.addEventListener("message", function (event) {
        console.log("Received message:", event.data);

        if (event.data.type === "PHONE_VERIFICATION_RESULT") {
          showResult(event.data.data);
        }
      });

      async function startVerification(mode) {
        const apiUrl = document.getElementById("apiUrl").value;
        const jwtToken = document.getElementById("jwtToken").value;
        if (!apiUrl || !jwtToken) {
          alert("API URL과 JWT Token을 입력해주세요");
          return;
        }

        // 사용자 인터랙션 직후 창을 먼저 열어야 팝업 차단 우회 가능
        let authWindow = null;
        if (mode === "mobile") {
          // 모바일: 새 탭으로 열기
          authWindow = window.open("about:blank", "_blank");
        } else {
          // PC: 팝업 창으로 열기 (크기 지정)
          const width = 410;
          const height = 500;
          const leftpos = screen.width / 2 - width / 2;
          const toppos = screen.height / 2 - height / 2;
          const winopts = `width=${width},height=${height},toolbar=no,status=no,statusbar=no,menubar=no,scrollbars=no,resizable=no,left=${leftpos},top=${toppos}`;
          authWindow = window.open("about:blank", "auth_popup", winopts);
        }

        if (!authWindow) {
          alert("팝업이 차단되었습니다. 팝업 차단을 해제해주세요.");
          return;
        }

        // 필요 시 로딩 화면 표시
        // authWindow.document.write(
        //   '<html><body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;"><p>본인인증 준비중...</p></body></html>'
        // );

        try {
          // 결과 초기화
          document.getElementById("result").classList.remove("show");

          // 본인인증 시작 API 호출
          const response = await fetch(
            `${apiUrl}/v1/verification/phone/account-verification`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${jwtToken}`,
              },
            }
          );

          if (!response.ok) {
            authWindow.close();
            throw new Error(`API 호출 실패: ${response.status}`);
          }

          const data = await response.json();
          const { certViewUrl, formData } = data.data;

          // 미리 열어둔 창에 form HTML 작성 후 자동 submit
          const formHtml = createVerificationForm(certViewUrl, formData);
          authWindow.document.open();
          authWindow.document.write(formHtml);
          authWindow.document.close();
        } catch (error) {
          if (authWindow) authWindow.close();
          console.error("Error:", error);
          alert("오류가 발생했습니다: " + error.message);
        }
      }

      function showResult(data) {
        /**
         * 에러 발생 시에는 code가 포함됨. 성공 시에는 포함되지 않음.
         * code 종류 - IDENTITY_VERIFICATION_ALREADY_EXISTS - 이미 본인인증이 완료된 경우
         *             - AlreadyExists - 이미 발신번호가 등록 된 경우
         *             - IDENTITY_VERIFICATION_CI_MISMATCH - 본인인증된 사람과 발신번호 등록 요청된 사람이 다를 경우
         *             - BAD_REQUEST - param_opt 값이 누락된 경우
         */

        const resultDiv = document.getElementById("result");
        const resultTitle = document.getElementById("resultTitle");
        const resultContent = document.getElementById("resultContent");

        resultDiv.classList.remove("result-success", "result-error");

        if (data.success) {
          resultDiv.classList.add("result-success");
          resultTitle.textContent = "✓ 본인인증 성공";
          resultContent.innerHTML = `
          <div class="result-item">
            <span class="result-label">code:</span>
            <span class="result-value">${data.code}</span>
          </div>
          <div class="result-item">
            <span class="result-label">message:</span>
            <span class="result-value">${data.message}</span>
          </div>
        `;
        } else {
          resultDiv.classList.add("result-error");
          resultTitle.textContent = "✕ 본인인증 실패";
          resultContent.innerHTML = `
          <div class="result-item">
            <span class="result-label">code:</span>
            <span class="result-value">${data.code}</span>
          </div>
          <div class="result-item">
            <span class="result-label">message:</span>
            <span class="result-value">${data.message}</span>
          </div>
        `;
        }

        resultDiv.classList.add("show");
      }
    </script>
  </body>
</html>
